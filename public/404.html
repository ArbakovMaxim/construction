<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Createx Construction Bureau</title>
    <script>
      // GitHub Pages has no SPA fallback: a direct hit on /construction/News
      // returns this 404 page. Encode the requested path into a query string
      // and bounce to index.html, where the snippet in index.html restores it
      // via history.replaceState before React Router boots.
      // pathSegmentsToKeep = 1 keeps the "/construction" project subdirectory.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
