<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E212C" />

    <title>Createx Construction Bureau</title>
    <meta
      name="description"
      content="Createx Construction Bureau — construction, repairs, interior design and project development. We build residential and commercial spaces from concept to completion."
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Createx Construction Bureau" />
    <meta
      property="og:description"
      content="Construction, repairs, interior design and project development — from concept to completion."
    />
    <meta property="og:url" content="https://www.createconstruction.site/" />
    <meta property="og:site_name" content="Createx Construction Bureau" />
    <!-- Crawlers do not resolve relative URLs, so og:image must be absolute. -->
    <meta property="og:image" content="https://www.createconstruction.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tower crane on a Createx construction site" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.createconstruction.site/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restores the path encoded by 404.html (GitHub Pages SPA fallback)
      // before React Router boots. No-op on hosts with a real SPA rewrite.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="modal"></div>
  </body>
</html>
